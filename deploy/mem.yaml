apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-stress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory-stress
  template:
    metadata:
      labels:
        app: memory-stress
    spec:
      containers:
        - name: memory-stress
          image: polinux/stress
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "200m"
              memory: "512Mi"
          command:
            - stress
            - "--vm"
            - "1"
            - "--vm-bytes"
            - "400M"
            - "--vm-hang"
            - "1"
