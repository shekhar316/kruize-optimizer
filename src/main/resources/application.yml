quarkus:
  application:
    name: kruize-optimizer-service
    version: 1.0.0
  smallrye-openapi:
    path: /openapi
  swagger-ui:
    path: /swagger-ui
    always-include: ${ENABLE_SWAGGER:true}

  # Enable configuration for a production-ready logging environment
  log:
    console:
      json:
        enabled: false
        pretty-print: false

  # --- Rest Client Config ---
  rest-client:
    kruize-api:
      # URL of the Kruize Autotune service
      # In k8s: http://<service-name>.<namespace>:<port>
      url: ${KRUIZE_URL:http://kruize:8080}

